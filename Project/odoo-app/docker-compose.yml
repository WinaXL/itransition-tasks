## Rolls out a local Odoo 17 instance with the CVForge viewer addon mounted.
##   docker compose up -d
## Then open http://localhost:8069, create a database, enable developer mode,
## update the apps list and install "CVForge Position Viewer".
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db:/var/lib/postgresql/data

  odoo:
    image: odoo:17.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./addons:/mnt/extra-addons
      - odoo-data:/var/lib/odoo

volumes:
  odoo-db:
  odoo-data:
